<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أثر — خزانة الكتب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&amp;family=Amiri:wght@400;700&amp;family=El+Messiri:wght@500;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B4533}a:hover{color:#123324}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7EE; color: #1E2823; font-family: 'Tajawal', 'Almarai', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'El Messiri', 'Amiri', serif; font-weight: 700; font-size: 28px; line-height: 36px; color: #1B4533">خزانة الكتب</h1>
<span style="font-size: 13px; color: #5F6B63">أمهات المصادر الحديثية والفقهية</span>
</header>

<div style="padding: 12px 20px 4px">
<div style="position: relative; display: flex; align-items: center; gap: 10px">
<span style="flex: 0 0 38px; font-size: 12.5px; font-weight: 700; color: #5F6B63">الإقليم</span>
<button type="button" aria-label="تصفية حسب الإقليم" aria-haspopup="listbox" aria-expanded="{{ region.open }}" onClick="{{ region.toggle }}" style="flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid {{ region.border }}; background: {{ region.bg }}; color: {{ region.ink }}; font-size: 14px; font-weight: {{ region.weight }}; display: flex; align-items: center; gap: 9px">
<span style="flex: 0 0 9px; height: 9px; border-radius: 50%; background: {{ region.dot }}"></span>
<span style="flex: 1; min-width: 0; text-align: start">{{ region.label }}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{ region.chevron }}; transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ region.open }}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-label="تصفية حسب الإقليم" style="position: absolute; top: 50px; inset-inline-start: 48px; inset-inline-end: 0; z-index: 5; background: #FFFFFF; border: 1px solid #EAE3CF; border-radius: 24px; padding: 6px; box-shadow: 0 2px 6px rgba(27,69,51,0.08), 0 18px 40px rgba(27,69,51,0.18); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ region.options }}" as="opt" hint-placeholder-count="4">
<button type="button" role="option" aria-selected="{{ opt.selected }}" onClick="{{ opt.pick }}" style="flex: 0 0 auto; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: {{ opt.bg }}; color: {{ opt.ink }}; font-size: 14px; font-weight: {{ opt.weight }}; display: flex; align-items: center; gap: 9px">
<span style="flex: 0 0 9px; height: 9px; border-radius: 50%; background: {{ opt.dot }}"></span>
<span style="flex: 1; min-width: 0; text-align: start">{{ opt.label }}</span>
<sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</button>
</sc-for>
</div>
</sc-if>
</div>
</div>

<main style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{ showMadinah }}" hint-placeholder-val="{{ true }}">
<article style="flex: 0 0 auto; background: #FFFFFF; border-radius: 26px; padding: 18px; box-shadow: 0 1px 2px rgba(27,69,51,0.06), 0 4px 10px rgba(27,69,51,0.05), 0 14px 30px rgba(27,69,51,0.07); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 16px">
<div aria-hidden="true" style="flex: 0 0 108px; height: 152px; box-sizing: border-box; border-radius: 6px 10px 10px 6px; background: #1B4533; padding: 8px; box-shadow: 0 6px 14px rgba(27,69,51,0.28)">
<div style="height: 100%; box-sizing: border-box; border: 1px solid #C98628; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="width: 22px; height: 1px; background: #C98628"></span>
<span style="font-family: 'Amiri', serif; font-weight: 700; font-size: 26px; line-height: 34px; color: #F3DDAE">الموطأ</span>
<span style="width: 22px; height: 1px; background: #C98628"></span>
<span style="font-size: 11px; color: #D5E3D9">مالك بن أنس</span>
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E3EFE8; color: #1B4533; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 50%; background: #2E7355"></span><span>أهل المدينة</span></span>
<h2 style="margin: 0; font-family: 'El Messiri', 'Amiri', serif; font-weight: 700; font-size: 24px; line-height: 32px; color: #1E2823">الموطأ</h2>
<span style="font-size: 13px; line-height: 20px; color: #1E2823">الإمام مالك بن أنس · ت ١٧٩هـ</span>
<span style="font-size: 12.5px; line-height: 20px; color: #5F6B63">رواية يحيى بن يحيى الليثي</span>
</div>
</div>
<p style="margin: 0; font-family: 'Almarai', 'Tajawal', sans-serif; font-size: 13.5px; line-height: 24px; color: #3C4841; text-wrap: pretty">من أقدم المصنفات الجامعة بين الحديث والفقه، مرتّب على الأبواب، وعليه مدار رواية أهل المدينة.</p>
<a href="Main.dc.html" style="height: 48px; border-radius: 16px; background: #1B4533; color: #FFFFFF; font-size: 14.5px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
<span>تصفّح آثار الكتاب</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
</article>
</sc-if>

<sc-if value="{{ showAndalus }}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex: 0 0 auto; width: 100%; padding: 14px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2823; text-align: start; box-shadow: 0 1px 2px rgba(27,69,51,0.06), 0 8px 22px rgba(27,69,51,0.06); display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: 0 0 60px; height: 84px; box-sizing: border-box; border-radius: 4px 8px 8px 4px; background: #6D3B66; padding: 5px"><span style="height: 100%; box-sizing: border-box; border: 1px solid #C98628; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: 'Amiri', serif; font-weight: 700; font-size: 14px; line-height: 20px; color: #F3DDAE; text-align: center">المدونة</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'El Messiri', 'Amiri', serif; font-weight: 700; font-size: 18px; line-height: 26px">المدونة الكبرى</span>
<span style="font-size: 12.5px; line-height: 19px; color: #3C4841">سحنون بن سعيد التنوخي · ت ٢٤٠هـ</span>
<span style="font-size: 12.5px; line-height: 19px; color: #5F6B63">عن ابن القاسم عن مالك</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #6D3B66; margin-top: 2px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #6D3B66"></span><span>الأندلس والمغرب</span></span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
</sc-if>

<sc-if value="{{ showSham }}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex: 0 0 auto; width: 100%; padding: 14px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2823; text-align: start; box-shadow: 0 1px 2px rgba(27,69,51,0.06), 0 8px 22px rgba(27,69,51,0.06); display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: 0 0 60px; height: 84px; box-sizing: border-box; border-radius: 4px 8px 8px 4px; background: #25426E; padding: 5px"><span style="height: 100%; box-sizing: border-box; border: 1px solid #C98628; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: 'Amiri', serif; font-weight: 700; font-size: 14px; line-height: 20px; color: #F3DDAE; text-align: center">سنن<br>الأوزاعي</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'El Messiri', 'Amiri', serif; font-weight: 700; font-size: 18px; line-height: 26px">سنن الأوزاعي</span>
<span style="font-size: 12.5px; line-height: 19px; color: #3C4841">عبد الرحمن بن عمرو الأوزاعي · ت ١٥٧هـ</span>
<span style="font-size: 12.5px; line-height: 19px; color: #5F6B63">مرويات إمام أهل الشام وآثاره</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #25426E; margin-top: 2px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #25426E"></span><span>أهل الشام</span></span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
</sc-if>

</main>

<nav aria-label="التنقل الرئيسي" style="display: flex; background: #FFFFFF; border-top: 1px solid #EAE3CF; padding: 6px 8px 8px">
<a href="Main.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6B63; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M9 9h6M9 13h4"></path></svg></span>
<span>الآثار</span>
</a>
<a href="Narrators.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6B63; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
<span>الرواة</span>
</a>
<a href="Books.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #1B4533; font-size: 12px; font-weight: 700">
<span style="width: 56px; height: 28px; border-radius: 14px; background: #DCE8DF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span>
<span>الكتب</span>
</a>
<a href="Favorites.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6B63; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg></span>
<span>المحفوظات</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"regionMenuOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const options = [
      { id: 'all', label: 'كل الأقاليم' },
      { id: 'madinah', label: 'أهل المدينة', dot: '#2E7355', soft: '#E3EFE8', ink: '#1B4533' },
      { id: 'sham', label: 'أهل الشام', dot: '#25426E', soft: '#E2E8F2', ink: '#25426E' },
      { id: 'andalus', label: 'الأندلس والمغرب', dot: '#6D3B66', soft: '#EFE4EC', ink: '#6D3B66' }
    ];
    const sel = s.region ?? 'all';
    const cur = options.find((o) => o.id === sel) || options[0];
    const active = cur.id !== 'all';
    const open = s.open !== undefined ? s.open : (this.props.regionMenuOpen ?? false);
    return {
      showMadinah: !active || cur.id === 'madinah',
      showSham: !active || cur.id === 'sham',
      showAndalus: !active || cur.id === 'andalus',
      region: {
        open: open,
        label: cur.label,
        dot: cur.dot || '#8A8F86',
        bg: active ? cur.soft : '#FFFFFF',
        ink: active ? cur.ink : '#3C4841',
        border: active ? cur.dot : '#E1D9C3',
        weight: active ? 700 : 500,
        chevron: open ? 'rotate(180deg)' : 'none',
        toggle: () => this.setState({ open: !open }),
        options: options.map((o) => {
          const selected = o.id === cur.id;
          return {
            label: o.label,
            dot: o.dot || '#8A8F86',
            selected: selected,
            bg: selected ? (o.soft || '#F3EEDF') : 'transparent',
            ink: selected ? (o.ink || '#1B4533') : '#1E2823',
            weight: selected ? 700 : 500,
            pick: () => this.setState({ region: o.id, open: false })
          };
        })
      }
    };
  }
}
</script>
</body>
</html>
