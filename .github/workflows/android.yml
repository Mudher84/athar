name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK مثبّت مسبقاً على مشغّلات ubuntu (ANDROID_HOME)؛ AGP ينزّل المنصة 36 إن نقصت
      # لا يوجد gradlew في المشروع؛ نستعمل نسخة Gradle التي يتطلبها AGP 9.1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Room schema unchanged
        run: git diff --exit-code app/schemas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athar-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
